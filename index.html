
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050914">
<meta name="description" content="AFTERGLOW — Futuristic digital clock by ILHMRRYR">
<title>AFTERGLOW — BY ILHMRRYR</title>

<style>
:root {
  --cyan: #55eaff;
  --blue: #638aff;
  --text: #eaf8ff;
  --muted: #829bb8;
  --panel: rgba(7, 20, 39, .76);
  --border: rgba(85, 234, 255, .25);
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  background: #050914;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: 24px 12px;
  overflow-x: hidden;
  color: var(--text);
  font-family: "Segoe UI", Arial, sans-serif;
  background:
    radial-gradient(ellipse at 50% 42%,
      #12355c 0%, #09182e 38%,
      #050914 78%);
}

button {
  font: inherit;
}

#stars {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
}

.ambient {
  position: fixed;
  width: 350px;
  height: 350px;
  border-radius: 50%;
  filter: blur(100px);
  opacity: .15;
  pointer-events: none;
  animation: ambientMove 12s ease-in-out infinite alternate;
}

.ambient.one {
  background: #008cff;
  top: -150px;
  left: -100px;
}

.ambient.two {
  background: #00eaff;
  bottom: -180px;
  right: -100px;
  animation-delay: -5s;
}

@keyframes ambientMove {
  to {
    transform: translate(70px, 50px) scale(1.2);
  }
}

.card {
  position: relative;
  z-index: 1;
  width: min(820px, 100%);
  padding: clamp(24px, 5vw, 48px) clamp(16px, 4vw, 38px) 24px;
  text-align: center;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 28px;
  background: var(--panel);
  box-shadow:
    0 0 70px rgba(0, 125, 255, .09),
    inset 0 1px rgba(255, 255, 255, .045);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  animation: cardIn 1s ease both;
}

.card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 12%;
  width: 76%;
  height: 1px;
  background: linear-gradient(
    90deg, transparent, var(--cyan), transparent
  );
  box-shadow: 0 0 20px var(--cyan);
}

@keyframes cardIn {
  from {
    opacity: 0;
    transform: translateY(18px) scale(.98);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.topline {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}

.brand {
  color: var(--cyan);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 4px;
}

.status {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: #9cebc8;
  font-size: 10px;
  letter-spacing: 1.5px;
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #57ffc0;
  box-shadow: 0 0 12px #57ffc0;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  50% { opacity: .4; }
}

.signature {
  display: block;
  margin-top: 20px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 6px;
  background: linear-gradient(
    90deg, #55eaff, #ffffff, #6c8dff, #55eaff
  );
  background-size: 250% auto;
  color: transparent;
  -webkit-background-clip: text;
  background-clip: text;
  animation: gradientFlow 5s linear infinite;
}

@keyframes gradientFlow {
  to { background-position: 250% center; }
}

.subtitle {
  margin-top: 42px;
  color: #86b7d9;
  font-size: 10px;
  letter-spacing: clamp(2px, 1vw, 5px);
}

.time-wrap {
  position: relative;
  margin-top: 15px;
}

#time {
  font-size: clamp(46px, 10.5vw, 98px);
  font-weight: 300;
  letter-spacing: clamp(0px, .7vw, 5px);
  line-height: 1.25;
  font-variant-numeric: tabular-nums;
  text-shadow:
    0 0 12px #55eaff66,
    0 0 45px #008cff33;
  white-space: nowrap;
}

#date {
  margin-top: 14px;
  font-size: clamp(13px, 2.7vw, 19px);
  font-weight: 500;
}

#zone {
  margin-top: 12px;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 3px;
}

.orbit {
  position: relative;
  width: 154px;
  height: 154px;
  margin: 30px auto 25px;
  display: grid;
  place-items: center;
  border: 1px dashed #55eaff66;
  border-radius: 50%;
  animation: spin 24s linear infinite;
}

.orbit::before,
.orbit::after {
  content: "";
  position: absolute;
  border: 1px solid #55eaff20;
  border-radius: 50%;
}

.orbit::before {
  inset: 12px;
}

.orbit::after {
  inset: -8px;
  border-color: #638aff20;
}

.orbit-dot {
  position: absolute;
  width: 9px;
  height: 9px;
  top: 13px;
  left: 28px;
  border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 15px var(--cyan);
}

.core {
  width: 66px;
  height: 66px;
  display: grid;
  place-items: center;
  border: 2px solid var(--cyan);
  border-radius: 50%;
  color: var(--cyan);
  font-size: 27px;
  box-shadow:
    0 0 25px #55eaff55,
    inset 0 0 20px #55eaff20;
  animation: corePulse 3s ease-in-out infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@keyframes corePulse {
  50% {
    box-shadow:
      0 0 40px #55eaff88,
      inset 0 0 25px #55eaff40;
  }
}

.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 12px;
}

.control {
  min-height: 42px;
  padding: 11px 15px;
  color: #d7f5ff;
  font-size: 11px;
  letter-spacing: 1px;
  border: 1px solid #55eaff45;
  border-radius: 10px;
  background: #102844aa;
  cursor: pointer;
  transition: .25s ease;
}

.control:hover {
  color: white;
  border-color: var(--cyan);
  background: #12395c;
  box-shadow: 0 0 22px #55eaff22;
  transform: translateY(-2px);
}

.control:focus-visible {
  outline: 2px solid white;
  outline-offset: 3px;
}

.control.active {
  border-color: #55eaff88;
}

.system {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  margin-top: 28px;
}

.system-item {
  padding: 13px 5px;
  border: 1px solid #ffffff0c;
  border-radius: 12px;
  background: #ffffff04;
}

.system-label {
  color: var(--muted);
  font-size: 9px;
  letter-spacing: 1.5px;
}

.system-value {
  margin-top: 7px;
  color: var(--cyan);
  font-size: 12px;
  font-weight: 600;
}

.footer {
  margin-top: 25px;
  color: #7089a7;
  font-size: 9px;
  letter-spacing: 2px;
  line-height: 1.8;
}

.footer span {
  color: var(--cyan);
}

.no-motion *,
.no-motion *::before,
.no-motion *::after {
  animation-play-state: paused !important;
  scroll-behavior: auto !important;
}

@media (max-width: 480px) {
  body {
    padding: 15px 10px;
  }

  .card {
    border-radius: 20px;
  }

  .brand {
    letter-spacing: 2px;
    font-size: 10px;
  }

  .status {
    font-size: 9px;
  }

  .signature {
    letter-spacing: 4px;
  }

  .subtitle {
    margin-top: 34px;
  }

  .orbit {
    width: 125px;
    height: 125px;
  }

  .core {
    width: 55px;
    height: 55px;
  }

  .system {
    gap: 6px;
  }

  .system-label {
    font-size: 8px;
    letter-spacing: .5px;
  }

  .control {
    padding: 10px;
    font-size: 10px;
  }
}

@media (prefers-reduced-motion: reduce) {
  body:not(.motion-enabled) *,
  body:not(.motion-enabled) *::before,
  body:not(.motion-enabled) *::after {
    animation-duration: .01ms !important;
  }
}
</style>
</head>

<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div class="ambient one"></div>
<div class="ambient two"></div>

<main class="card">
  <div class="topline">
    <div class="brand">✦ AFTERGLOW ✦</div>
    <div class="status">
      <span class="status-dot"></span>
      <span id="statusText">SYSTEM ONLINE</span>
    </div>
  </div>

  <span class="signature">✦ BY ILHMRRYR ✦</span>

  <div class="subtitle">
    TAKE A MOMENT · MAKE IT YOURS
  </div>

  <div class="time-wrap">
    <div id="time" role="timer"
         aria-label="Jam saat ini">00:00:00</div>
  </div>

  <div id="date">Memuat tanggal...</div>
  <div id="zone">WAKTU BENGKULU · WIB (UTC+7)</div>

  <div class="orbit" aria-hidden="true">
    <span class="orbit-dot"></span>
    <div class="core">✦</div>
  </div>

  <div class="controls">
    <button class="control" id="formatBtn">
      ↔ FORMAT: 24 JAM
    </button>
    <button class="control active" id="motionBtn">
      ✦ ANIMASI: ON
    </button>
    <button class="control" id="soundBtn">
      ♫ SUARA: OFF
    </button>
    <button class="control" id="fullBtn">
      ⛶ LAYAR PENUH
    </button>
  </div>

  <div class="system">
    <div class="system-item">
      <div class="system-label">ZONA WAKTU</div>
      <div class="system-value">UTC +7</div>
    </div>
    <div class="system-item">
      <div class="system-label">KONEKSI JAM</div>
      <div class="system-value" id="clockStatus">LIVE</div>
    </div>
    <div class="system-item">
      <div class="system-label">HARI INI</div>
      <div class="system-value" id="dayName">---</div>
    </div>
  </div>

  <div class="footer">
    DESIGNED IN THE DIGITAL UNIVERSE<br>
    <span>MADE WITH CARE · BY ILHMRRYR</span>
  </div>
</main>

<script>
"use strict";

const $ = id => document.getElementById(id);

const timeEl = $("time");
const dateEl = $("date");
const dayEl = $("dayName");
const clockStatus = $("clockStatus");

let use24Hour = true;
let motionOn = true;
let soundOn = false;
let audioContext = null;
let animationId = null;
let stars = [];

const timeZone = "Asia/Jakarta";

const timeFormatter = new Intl.DateTimeFormat("en-GB", {
  timeZone,
  hour: "2-digit",
  minute: "2-digit",
  second: "2-digit",
  hourCycle: "h23"
});

const dateFormatter = new Intl.DateTimeFormat("id-ID", {
  timeZone,
  weekday: "long",
  day: "numeric",
  month: "long",
  year: "numeric"
});

const dayFormatter = new Intl.DateTimeFormat("id-ID", {
  timeZone,
  weekday: "long"
});

function updateClock() {
  const now = new Date();

  const parts = Object.fromEntries(
    timeFormatter.formatToParts(now)
      .map(part => [part.type, part.value])
  );

  let hour = Number(parts.hour);
  const suffix = hour >= 12 ? "PM" : "AM";

  if (!use24Hour) {
    hour = hour % 12 || 12;
  }

  const hh = String(hour).padStart(2, "0");

  timeEl.textContent =
    `${hh}:${parts.minute}:${parts.second}` +
    (use24Hour ? "" : ` ${suffix}`);

  dateEl.textContent = dateFormatter.format(now);
  dayEl.textContent = dayFormatter.format(now);
  clockStatus.textContent = "LIVE";
}

$("formatBtn").addEventListener("click", () => {
  use24Hour = !use24Hour;

  $("formatBtn").textContent =
    use24Hour ? "↔ FORMAT: 24 JAM" : "↔ FORMAT: 12 JAM";

  updateClock();
  playTone(660, 0.045);
});

function stopStars() {
  if (animationId !== null) {
    cancelAnimationFrame(animationId);
    animationId = null;
  }
}

$("motionBtn").addEventListener("click", () => {
  motionOn = !motionOn;

  document.body.classList.toggle("no-motion", !motionOn);

  $("motionBtn").textContent =
    motionOn ? "✦ ANIMASI: ON" : "✦ ANIMASI: OFF";

  if (motionOn) {
    startStars();
  } else {
    stopStars();
  }

  playTone(520, 0.05);
});

// Suara opsional menggunakan Web Audio API.
function playTone(frequency, duration) {
  if (!soundOn) return;

  try {
    audioContext ??= new (
      window.AudioContext || window.webkitAudioContext
    )();

    if (audioContext.state === "suspended") {
      audioContext.resume();
    }

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.type = "sine";
    oscillator.frequency.value = frequency;
    gain.gain.setValueAtTime(0.035, audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(
      0.001,
      audioContext.currentTime + duration
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();
    oscillator.stop(audioContext.currentTime + duration);
  } catch (error) {
    console.warn("Audio tidak tersedia:", error);
  }
}

$("soundBtn").addEventListener("click", async () => {
  soundOn = !soundOn;

  if (soundOn) {
    try {
      audioContext ??= new (
        window.AudioContext || window.webkitAudioContext
      )();

      await audioContext.resume();
    } catch (error) {
      soundOn = false;
    }
  }

  $("soundBtn").textContent =
    soundOn ? "♫ SUARA: ON" : "♫ SUARA: OFF";

  $("soundBtn").classList.toggle("active", soundOn);

  if (soundOn) playTone(720, 0.12);
});

$("fullBtn").addEventListener("click", async () => {
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen();
    } else {
      await document.exitFullscreen();
    }
  } catch (error) {
    $("statusText").textContent = "FULLSCREEN TIDAK TERSEDIA";
  }
});

document.addEventListener("fullscreenchange", () => {
  $("fullBtn").textContent =
    document.fullscreenElement
      ? "⛶ KELUAR LAYAR PENUH"
      : "⛶ LAYAR PENUH";
});

// Latar belakang bintang.
const canvas = $("stars");
const ctx = canvas.getContext("2d");

let width = 0;
let height = 0;
let pixelRatio = 1;

function resize() {
  pixelRatio = Math.min(window.devicePixelRatio || 1, 2);

  width = window.innerWidth;
  height = window.innerHeight;

  canvas.width = Math.floor(width * pixelRatio);
  canvas.height = Math.floor(height * pixelRatio);

  canvas.style.width = width + "px";
  canvas.style.height = height + "px";

  ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);

  stars = Array.from(
    { length: Math.min(140, Math.floor(width / 8)) },
    () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      r: Math.random() * 1.4 + 0.3,
      speed: Math.random() * 0.35 + 0.08,
      alpha: Math.random() * 0.55 + 0.25,
      phase: Math.random() * Math.PI * 2
    })
  );

  if (motionOn) startStars();
}

function drawStars() {
  animationId = null;

  if (!motionOn) return;

  ctx.clearRect(0, 0, width, height);

  const t = performance.now() / 1000;

  for (const star of stars) {
    star.y -= star.speed;

    if (star.y < -3) {
      star.y = height + 3;
      star.x = Math.random() * width;
    }

    const flicker =
      0.65 + 0.35 * Math.sin(t * 1.5 + star.phase);

    ctx.beginPath();
    ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
    ctx.fillStyle =
      `rgba(111, 220, 255, ${star.alpha * flicker})`;
    ctx.fill();
  }

  animationId = requestAnimationFrame(drawStars);
}

function startStars() {
  if (!motionOn || animationId !== null) return;
  animationId = requestAnimationFrame(drawStars);
}

window.addEventListener("resize", resize);

document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    stopStars();
  } else if (motionOn) {
    startStars();
  }

  updateClock();
});

updateClock();
setInterval(updateClock, 250);
resize();
</script>
</body>
</html>
